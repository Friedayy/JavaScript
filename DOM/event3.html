<!DOCTYPE html>
<html lang="en">
<head>
    <title>Document</title>
    <style>
        .highlight {
            color: blue;
            font-size: 40px;
        }
    </style>
</head>
<body>
    <h1 id="title">Welcome Amaan</h1>
    <button id="btn">Highlight</button>
    <script>
        const button = document.querySelector("#btn");
        button.addEventListener("click", ()=>{
            document.querySelector("#title").classList.toggle("highlight");
        })
        console.log(button);
        
    </script>

</body>
</html>
