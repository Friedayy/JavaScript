<!DOCTYPE html>
<html lang="en">
<head>
    <title>Document</title>
</head>
<body>
    <h1 id="title">Hello</h1>
    <button id="btn">Change</button>
    <script>
        document.querySelector("#btn").addEventListener("click", ()=>{
            document.getElementById("title").textContent = "Welcome Amaan";
        })
    </script>
</body>
</html>
