<!DOCTYPE html>
<html lang="en">
<head>
    <title>Document</title>
</head>
<body>
    <input id="username" type="text">
    <p id="output"></p>
    <script>
        const input = document.querySelector("#username");
        const output = document.querySelector("#output");

        input.addEventListener('input', ()=>{
            output.textContent = input.value;
            
        })
    </script>
</body>
</html>
